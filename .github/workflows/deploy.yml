name: Publish Site

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  # the site pulls null0's api.json and cart list at build time, so a null0
  # release changes what this builds without anything changing here
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --force
      - run: npm run build --if-present
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # a pull_request run cannot deploy to github-pages, so without this every
    # PR shows a red check for a deploy that was never meant to happen. the
    # build job above still runs on PRs, which is the part worth checking.
    # anything that isn't a PR (push, manual rebuild) does deploy.
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
